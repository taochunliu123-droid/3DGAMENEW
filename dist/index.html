<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101a23">
<meta name="description" content="用 ACTORS 練習更好的 Prompt，最多四隊同場競賽，過關收集 3D 寵物夥伴。Practice better prompts with ACTORS in teams and collect 3D pet buddies.">
<title>Prompt Arena 3D｜PM Mayors</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="Prompt Arena"><span class="brand-mark">P<span>✦</span></span><span>PROMPT <b>ARENA</b><small data-i18n="brandSub"></small></span></a>
  <nav class="top-actions">
    <div class="seg lang-seg" role="group" aria-label="Language 語言" id="langSeg">
      <button data-lang="zh">中</button><button data-lang="en">EN</button><button data-lang="both">中+EN</button>
    </div>
    <button class="nav-btn" data-go="teams" data-i18n="navTeams"></button>
    <button class="nav-btn" data-go="map" data-i18n="navMap"></button>
    <button id="guideBtn" class="nav-btn" data-i18n="navGuide"></button>
    <button id="fullBtn" class="icon-btn" data-i18n-aria="fullscreen">⛶</button>
    <button id="soundBtn" class="icon-btn" aria-pressed="false" data-i18n-aria="sound">♫</button>
  </nav>
</header>

<main class="app">
  <aside class="stage-col">
    <section class="arena" data-i18n-aria="arena">
      <div id="scene"></div>
      <div id="webglError" hidden data-i18n="webgl"></div>
      <div class="arena-shade"></div>
      <div class="arena-top"><span id="location"></span></div>
      <div id="enemyHud" class="enemy-hud" hidden>
        <div><b id="enemyName"></b><span id="enemyHpText">100</span></div>
        <meter id="enemyHp" min="0" max="100" value="100">100</meter>
      </div>
      <div id="battleToast" class="battle-toast" aria-live="polite"></div>
      <div id="finaleBanner" class="finale-banner" hidden aria-live="assertive"></div>
    </section>
    <section id="scoreboard" class="scoreboard"></section>
  </aside>

  <section class="panel">
    <div id="screen-teams" class="screen">
      <div class="screen-head">
        <h2 data-i18n="teamsTitle"></h2>
        <div class="seg" role="group" id="teamCountSeg"></div>
      </div>
      <div class="seg-row">
        <span class="seg-label" data-i18n="bank"></span>
        <div class="seg" role="group" id="audienceSeg">
          <button data-audience="kids" data-i18n="kids"></button><button data-audience="adults" data-i18n="adults"></button>
        </div>
        <span class="save-note" data-i18n="saveNote"></span>
      </div>
      <div id="teamCards" class="team-cards"></div>
      <div class="screen-foot">
        <div class="foot-tools">
          <button id="exportBtn" class="quiet" data-i18n-short="export"></button>
          <label class="quiet file-btn"><span data-i18n-short="import"></span><input id="importInput" type="file" accept="application/json,.json" hidden></label>
          <button id="resetBtn" class="quiet danger" data-i18n-short="reset"></button>
        </div>
        <button class="primary" data-go="map" data-i18n="toMap"></button>
      </div>
    </div>

    <div id="screen-map" class="screen" hidden>
      <div class="screen-head">
        <h2 data-i18n="mapTitle"></h2>
        <div class="map-settings">
          <label><span data-i18n="perStage"></span><select id="countSelect"></select></label>
          <label><span data-i18n="timerLabel"></span><select id="timerSelect"></select></label>
        </div>
      </div>
      <div id="stageGrid" class="stage-grid"></div>
      <div class="stage-brief">
        <p id="stageTip"></p>
        <button id="startBtn" class="primary" disabled></button>
      </div>
    </div>

    <div id="screen-play" class="screen play" hidden>
      <div class="play-top">
        <button id="exitBtn" class="quiet" data-i18n="exit"></button>
        <span id="stageBadge" class="stage-badge"></span>
        <span id="progress" class="progress"></span>
        <span id="timer" class="timer" hidden></span>
      </div>
      <div class="question-box">
        <p id="scenario" class="scenario"></p>
        <h2 id="question" tabindex="-1"></h2>
        <p id="hintText" class="hint" hidden></p>
      </div>
      <div id="options" class="options"></div>
      <div id="answerPad" class="answer-pad"></div>
      <div id="feedback" class="feedback" hidden aria-live="polite"></div>
      <div class="play-actions">
        <button id="hintBtn" class="quiet" data-i18n="hint"></button>
        <button id="skipBtn" class="quiet" data-i18n="skip"></button>
        <button id="revealBtn" class="primary small" disabled data-i18n="reveal"></button>
        <button id="nextBtn" class="primary small" hidden></button>
      </div>
    </div>

    <div id="screen-end" class="screen" hidden>
      <div class="screen-head"><h2 id="endTitle"></h2></div>
      <p id="endSummary" class="end-summary"></p>
      <div id="endRows" class="end-rows"></div>
      <div class="screen-foot">
        <button id="retryBtn" class="quiet" data-i18n-short="retry"></button>
        <div class="foot-right"><button class="quiet" data-go="map" data-i18n-short="backMap"></button><button id="nextStageBtn" class="primary" hidden></button></div>
      </div>
    </div>
  </section>
</main>

<div id="unlock" class="unlock" hidden role="dialog" aria-modal="true" aria-labelledby="unlockTitle">
  <div class="confetti" aria-hidden="true"></div>
  <div class="unlock-card">
    <p id="unlockTeam" class="unlock-team"></p>
    <h2 id="unlockTitle" data-i18n="newBuddy"></h2>
    <div class="unlock-pet"><img id="unlockImg" alt=""><span id="unlockEmoji" hidden></span></div>
    <p id="unlockName" class="unlock-name"></p>
    <p id="unlockStars" class="unlock-stars"></p>
    <button id="unlockBtn" class="primary"></button>
  </div>
</div>

<dialog id="guide">
  <div class="dialog-head"><h2 data-i18n="navGuide"></h2><button id="closeGuide" class="icon-btn" data-i18n-aria="close">×</button></div>
  <div id="guideBody"></div>
</dialog>

<a href="https://pmmayors.com" target="_blank" rel="noopener noreferrer" class="pm-frame no-print">
  <img src="/logo.png" alt="PM Mayors" class="pm-frame-logo">
  <strong class="pm-frame-name">PM Mayors</strong>
  <span class="pm-frame-tagline">Your AI PM Ambassador</span>
</a>

<script type="module" src="/app.js"></script>
</body>
</html>
